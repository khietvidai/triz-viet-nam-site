[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "triz-cards"
version = "0.1.0"
description = "Reproducible Vietnamese TRIZ learning cards"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "reportlab>=4,<5", "pydantic>=2,<3", "PyYAML>=6,<7", "PyMuPDF>=1.26,<2", "fonttools>=4,<5"]

[project.scripts]
triz-cards = "triz_cards.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["triz_cards*"]
